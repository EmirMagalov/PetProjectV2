server {
    listen 80;
    server_name exoconnect.info www.exoconnect.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exoconnect.info www.exoconnect.info;

    ssl_certificate /etc/letsencrypt/live/exoconnect.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exoconnect.info/privkey.pem;

    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # 1. JS И CSS: Должны отдавать 404, если файл не найден (А НЕ index.html!)
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 2. КАРТИНКИ И ШРИФТЫ
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. ГЛАВНЫЙ HTML (Не кэшируем)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    # 4. SPA РОУТИНГ ДЛЯ VUE: Ищет сначала ТОЧНЫЙ ФАЙЛ ($uri), а если его нет — перенаправляет на index.html
    location / {
        try_files $uri /index.html;
    }

    # 5. БЭКЕНД API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}