server {
    listen 80;
    server_name exoconnect.info www.exoconnect.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exoconnect.info www.exoconnect.info;

    ssl_certificate /etc/letsencrypt/live/exoconnect.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exoconnect.info/privkey.pem;

    client_max_body_size 10M;
    root /usr/share/nginx/html;

    # 1. КАРТИНКИ И ШРИФТЫ: Кэшируем намертво на 30 дней (чтобы грудились мгновенно без скачивания с сервера)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 2. ГЛАВНЫЙ ФАЙЛ (HTML): НИКОГДА не кэшируем! 
    # Благодаря этому пользователь при открытии мини-аппа ВСЕГДА сразу видит самую свежую версию кода.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # 3. ВСЁ ОСТАЛЬНОЕ (SPA роутинг):
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}