server {
    listen 80;
    server_name pocketpet.online www.pocketpet.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exoconnect.info www.exoconnect.info;

    ssl_certificate /etc/letsencrypt/live/exoconnect.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exoconnect.info/privkey.pem;

    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Запрещаем прямой просмотр любых папок без конкретного файла
    location ~ ^.*/$ {
        try_files /index.html =404;
    }

    # 2. Статика (JS, CSS, картинки, шрифты)
    location ~* \.(js|css|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. Главный index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    # 4. SPA Роутинг для ВСЕХ страниц (включая /saloon и любые другие)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Бэкенд API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}