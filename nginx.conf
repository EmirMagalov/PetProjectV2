server {
    listen 80;
    server_name pocketpet.online www.pocketpet.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pocketpet.online www.pocketpet.online;

    ssl_certificate /etc/letsencrypt/live/pocketpet.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocketpet.online/privkey.pem;

    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Запрещаем просмотр содержимого папок (autoindex выключен по умолчанию)
    autoindex off;

    # 2. Бэкенд API (Выше статики, чтобы запросы к API не перехватывались)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 3. Статика с агрессивным кэшированием (JS, CSS, WebP, PNG и т.д.)
    location ~* \.(js|css|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 4. SPA Роутинг и СТРОГИЙ запрет кэширования index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Гарантируем, что сам HTML-файл никогда не закэшируется браузером!
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }
}