server {
    listen 80;
    server_name exoconnect.info www.exoconnect.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exoconnect.info www.exoconnect.info;

    ssl_certificate /etc/letsencrypt/live/exoconnect.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exoconnect.info/privkey.pem;

    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip сжатие для ускорения загрузки на мобильных устройствах
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Запрещаем индексацию листинга папок
    autoindex off;

    # 2. JS и CSS файлы — требуем проверку свежести (E-Tag / Revalidate)
    # Это решает проблему зависания старых бандлов в Telegram WebApp на iOS
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 3. Картинки и шрифты — можно кэшировать
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 4. Бэкенд API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 5. SPA Роутинг для ВСЕХ маршрутов (включая /saloon, /saloon/ и т.д.)
    # Важно: index.html сам по себе никогда НЕ кэшируется!
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}