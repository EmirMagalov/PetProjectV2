server {
    listen 80;
    server_name exoconnect.info www.exoconnect.info;
    return 301 https://$host$request_uri; # Автоматический редирект с HTTP на HTTPS
}

server {
    listen 443 ssl;
    server_name exoconnect.info www.exoconnect.info;

    # Пути к сертификатам внутри контейнера Nginx
    ssl_certificate /etc/letsencrypt/live/exoconnect.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exoconnect.info/privkey.pem;
    client_max_body_size 10M;

    root /usr/share/nginx/html;

    # Кэширование картинок и статики, чтобы они не грузились на ходу
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}