version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pet_postgres
    restart: always
    environment:
      POSTGRES_USER: pet_user
      POSTGRES_PASSWORD: pet_password
      POSTGRES_DB: pet_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_user -d pet_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: pet_backend
    restart: always
    # Добавили флаг --reload для автоматического обновления FastAPI при сохранении файлов
    command: sh -c "sleep 3 && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app  # <--- САМОЕ ВАЖНОЕ: связываем папку src на ПК с /app в контейнере
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: pet_bot
    restart: always
    # Для бота используем watchfiles (ставится вместе с uvicorn/fastapi), чтобы он перезапускался при правках кода
    command: ["python", "-m", "watchfiles", "python -m bot.main"]
    volumes:
      - ./src:/app  # <--- Тоже прокидываем код для бота
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: pet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  pgdata: