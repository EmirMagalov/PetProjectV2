version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pet_postgres
    restart: always
    environment:
      POSTGRES_USER: pet_user
      POSTGRES_PASSWORD: pet_password
      POSTGRES_DB: pet_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Добавляем проверку здоровья базы
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_user -d pet_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: pet_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # <--- Бэкенд ждет, пока база реально ответит

  bot:
    build: .
    container_name: pet_bot
    restart: always
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # <--- Бот тоже ждет базу
      backend:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: pet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  pgdata: