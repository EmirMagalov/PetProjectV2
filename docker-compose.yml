version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pet_postgres
    restart: always
    environment:
      POSTGRES_USER: pet_user
      POSTGRES_PASSWORD: pet_password
      POSTGRES_DB: pet_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: pet_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  bot:
    build: .
    container_name: pet_bot
    restart: always
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    depends_on:
      - db
      - backend

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: pet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  pgdata: