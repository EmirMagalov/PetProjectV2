services:
  backend:
    build: .
    container_name: pet_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: pet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  bot:
    build: .
    container_name: pet_bot
    restart: always
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    depends_on:
      - backend